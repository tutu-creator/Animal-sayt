<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #191C1B;
      color: white;
      font-family: sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }
    .box {
      background: #171B19;
      padding: 30px 60px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .logo-brand-text {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.01em;
      display: inline-flex;
    }
    .brand-pawl { color: #FFFFFF; }
    .brand-y { color: #FA7052; }
    .brand-paw-svg {
      width: 48px;
      height: 48px;
      fill: #FA7052;
      display: inline-block;
    }
    .ref-img {
      max-width: 600px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <h3 style="margin:0;color:#8E9992;">İstifadəçinin Göndərdiyi Şəkil (Orijinal):</h3>
  <img class="ref-img" src="images/user_pawly_reference.jpg" alt="Pawly Reference">

  <h3 style="margin:0;color:#8E9992;">Bizim Hazırladığımız Logo (Fredoka Bold + Ağ Pawl + Narıncı y + Pəncə):</h3>
  <div class="box">
    <span class="logo-brand-text">
      <span class="brand-pawl">Pawl</span><span class="brand-y">y</span>
    </span>
    <svg class="brand-paw-svg" viewBox="0 0 32 32">
      <!-- 4 Toes matching reference -->
      <ellipse cx="6" cy="13.5" rx="2.5" ry="3.7" transform="rotate(-30 6 13.5)" />
      <ellipse cx="12" cy="9" rx="2.7" ry="4.2" transform="rotate(-10 12 9)" />
      <ellipse cx="20" cy="9" rx="2.7" ry="4.2" transform="rotate(10 20 9)" />
      <ellipse cx="26" cy="13.5" rx="2.5" ry="3.7" transform="rotate(30 26 13.5)" />
      <!-- Central Bean Pad matching reference -->
      <ellipse cx="16" cy="22.5" rx="7.4" ry="5.6" />
    </svg>
  </div>
</body>
</html>
